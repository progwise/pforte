# The example application next to pforte, under a name of its own: an application to sign in to, for trying
# pforte on real devices. deploy.sh adds this file when APP_HOST is set in .env. Not for production: its
# sessions are in memory.
version: '3.8'

services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE in .env}
    environment:
      ISSUER: https://${PFORTE_HOST}
      # A public client, registered in pforte's administration with the redirect https://<APP_HOST>/callback.
      CLIENT_ID: ${APP_CLIENT_ID:-example-app}
      BASE_URL: https://${APP_HOST}
    read_only: true
    cap_drop: [ALL]
    networks: [proxy]
    deploy:
      replicas: 1
      placement:
        constraints: ['${PLACEMENT:-node.role == manager}']
      # It reads pforte's discovery document when it starts, and is started again until pforte answers.
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
      labels:
        caddy: ${APP_HOST}
        caddy.reverse_proxy: '{{upstreams 3400}}'
        caddy.encode: gzip zstd

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-caddy}
