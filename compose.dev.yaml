# Local development only: services that `pnpm dev` needs. Run with `pnpm dev:up`.
# Dev-only credentials; never use them in production.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pforte
      POSTGRES_PASSWORD: pforte
      POSTGRES_DB: pforte
    ports:
      - '${PFORTE_DB_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pforte -d pforte']
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches the e-mails pforte sends (codes, activation links). Open http://localhost:8026.
  mailpit:
    image: axllent/mailpit:v1.30
    ports:
      - '${PFORTE_SMTP_PORT:-1026}:1025'
      - '${PFORTE_MAIL_UI_PORT:-8026}:8025'

volumes:
  postgres-data:
