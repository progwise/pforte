name: Audit

# New advisories appear without a commit, so this also runs every Monday.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Dependencies that ship (fails on moderate or worse)
        run: pnpm audit --prod --audit-level=moderate
      - name: Development tools (informational; accepted advisories are listed in docs/security.md)
        run: pnpm audit --audit-level=moderate
        continue-on-error: true
